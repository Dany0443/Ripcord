services:
  ripcord:
    image: ghcr.io/rusux64-bit/ripcord:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ripcord
    ports:
      - "5224:5224"
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: ${PORT:-5224}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-900000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-120}
      FETCH_INFO_RATE_LIMIT_MAX: ${FETCH_INFO_RATE_LIMIT_MAX:-30}
      DOWNLOAD_RATE_LIMIT_MAX: ${DOWNLOAD_RATE_LIMIT_MAX:-8}
      COVER_RATE_LIMIT_MAX: ${COVER_RATE_LIMIT_MAX:-120}
      DOWNLOAD_CONCURRENCY: ${DOWNLOAD_CONCURRENCY:-4}
      METADATA_CONCURRENCY: ${METADATA_CONCURRENCY:-4}
      MAX_QUEUED_DOWNLOADS: ${MAX_QUEUED_DOWNLOADS:-8}
      MAX_PLAYLIST_TRACKS: ${MAX_PLAYLIST_TRACKS:-30}
      MAX_PLAYLIST_OUTPUT_BYTES: ${MAX_PLAYLIST_OUTPUT_BYTES:-2097152}
      MAX_COVER_BYTES: ${MAX_COVER_BYTES:-5242880}
      MAX_DOWNLOAD_BYTES: ${MAX_DOWNLOAD_BYTES:-104857600}
      MAX_AUDIO_OUTPUT_BYTES: ${MAX_AUDIO_OUTPUT_BYTES:-157286400}
      MAX_ZIP_TRACK_BYTES: ${MAX_ZIP_TRACK_BYTES:-41943040}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-0}
    # Optional: mount cookies.txt if hosting on a datacenter IP
    # volumes:
    #   - ./cookies.txt:/app/cookies.txt:ro
